<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dodge Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <section class="hud">
      <h1>Dodge!</h1>
      <p>Score: <span id="score">0</span> | Best: <span id="best">0</span></p>
    </section>

    <div class="game-wrap">
      <canvas id="gameCanvas" width="420" height="620"></canvas>
      <button id="startButton" class="start-button" type="button">Start Game</button>
    </div>

    <div class="controls" aria-label="Touch controls">
      <button class="move-button" data-direction="left" type="button">◀</button>
      <button class="move-button" data-direction="right" type="button">▶</button>
    </div>

    <p id="message">Press Space or click Start to begin.</p>
  </main>

  <script src="game.js"></script>
</body>
</html>
